[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layerwise"
version = "0.1.0"
description = "Explain why a network service is not reachable: DNS, TCP, TLS and HTTP checks with plain-language hints."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Eduardo Cozzolino" }]
keywords = ["network", "troubleshooting", "dns", "tcp", "tls", "diagnostics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eduardo-cozzolino/layerwise"
Repository = "https://github.com/eduardo-cozzolino/layerwise"
Issues = "https://github.com/eduardo-cozzolino/layerwise/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
layerwise = "layerwise.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
